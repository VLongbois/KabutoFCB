<h1>Création d'un nouveau combat</h1>

<form id="fight-form">
    <div>
        <label>Combattant 1
            <input name="fighter1" type="text" />
        </label>
    </div>
    <div>
        <label>Combattant 2
            <input name="fighter2" type="text" />
        </label>
    </div>
    <div>
        <label>Temps (en sec)
            <input name="time" type="number" value="60"/>
        </label>
    </div>
    <button type="submit">Valider</button>
</form>
